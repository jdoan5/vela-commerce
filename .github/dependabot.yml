# Keeping this repo's last commit recent is not vanity: GitHub disables scheduled
# workflows in a repository with 60 days of no activity, and merging these PRs resets that
# clock as a side effect.
#
# THIS COMMENT USED TO NAME THE WRONG STAKE, and the correction is worth keeping. It said
# the 60-day rule "would silently stop the nightly demo-reset job" — a job that has never
# existed, and which ADR 0010 has now decided will not exist: demo data is purged in-process
# while the container is awake, and GitHub's scheduler cannot reach that either way.
#
# What actually depends on this clock is codeql.yml, the one cron in the repository. That is
# a smaller stake than the sentence claimed, and stating the smaller true one is the point.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR per family rather than one per package, so a routine patch bump is a
      # single review rather than eight.
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      testing:
        patterns: ["xunit*", "Testcontainers*", "coverlet*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # github/codeql-action/init and .../analyze MUST move together. They are two
      # entries pinned to one SHA in codeql.yml, and the action refuses to analyse a
      # database that a different version initialised. Ungrouped, Dependabot raises a
      # PR per entry and BOTH fail: PR #8 bumped init, PR #10 bumped analyze, and each
      # one alone left the pair mismatched. Merging either first also breaks main until
      # the other lands.
      #
      # This is not a theoretical tidy-up - it is what actually happened on 2026-09-14,
      # and the two red PRs looked like the action was broken rather than like the
      # updates had been split.
      codeql-action:
        patterns: ["github/codeql-action*"]
