name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. The deploy workflow adds id-token: write for OIDC;
# this one only ever reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # No version here on purpose: global.json pins the SDK, so CI and the
          # developer machine cannot drift apart silently.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      # --settings coverage.runsettings is what makes the number below mean anything: without
      # it coverlet instruments all 36 assemblies in the output directory, framework included,
      # and reports 5.1% - a measure of how much of Microsoft's code these tests happen to run.
      # Read that file before quoting any coverage figure from this repository.
      - name: Domain tests
        run: >-
          dotnet test tests/VelaCommerce.Domain.Tests
          --no-build --configuration Release
          --settings coverage.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=domain.trx"
          --results-directory artifacts/test-results

      # Testcontainers starts a real PostgreSQL 18. The ubuntu-latest runner ships
      # a working Docker daemon, so no service container is declared here; letting
      # Testcontainers own the lifecycle keeps this identical to a local run.
      # No coverage collection here, and not only because the number would be meaningless for a
      # suite that asserts structure rather than behaviour. Coverlet REWRITES the assembly on
      # disk, injecting Coverlet.Core.Instrumentation.Tracker.<Assembly>_<guid> - whose
      # WriteHits and WriteLog read DateTime.UtcNow. ClockRules walks that same IL and was
      # entirely right to report it. The rule now skips instrumentation-injected types so the
      # suite survives if someone adds --collect here anyway, but the suite that reads compiled
      # IL should not be handed rewritten IL to read.
      - name: Architecture tests
        run: >-
          dotnet test tests/VelaCommerce.Architecture.Tests
          --no-build --configuration Release
          --logger "trx;LogFileName=architecture.trx"
          --results-directory artifacts/test-results

      - name: Integration tests
        run: >-
          dotnet test tests/VelaCommerce.Integration.Tests
          --no-build --configuration Release
          --settings coverage.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=integration.trx"
          --results-directory artifacts/test-results

      # -----------------------------------------------------------------------------------
      # A floor, not a badge.
      #
      # A badge is a picture of a number, and keeping one honest needs a mechanism to update
      # it - which is exactly how this repository ended up with a README GIF described as
      # "committed by CI on every merge" that was committed by hand, once. A floor needs no
      # mechanism: it is checked on every push and it fails when it is breached.
      #
      # 65% against a measured 68.1% at the time of writing. Set just under, so a real
      # regression fails and ordinary movement does not - and low enough to be raised
      # deliberately rather than lowered quietly.
      # -----------------------------------------------------------------------------------
      - name: Coverage floor
        env:
          MIN_LINE_COVERAGE: "65"
        run: |
          set -euo pipefail

          dotnet tool restore --tool-manifest dotnet-tools.json

          dotnet tool run reportgenerator \
            -reports:"artifacts/test-results/**/coverage.cobertura.xml" \
            -targetdir:artifacts/coverage \
            -reporttypes:"TextSummary;MarkdownSummaryGithub"

          summary="artifacts/coverage/Summary.txt"
          test -f "$summary" || { echo "::error::ReportGenerator produced no summary; the collector wrote no cobertura files."; exit 1; }

          line="$(sed -n 's/^ *Line coverage: \([0-9.]*\)%.*/\1/p' "$summary" | head -n1)"
          test -n "$line" || { echo "::error::Could not read a line-coverage figure out of $summary."; cat "$summary"; exit 1; }

          echo "Line coverage: ${line}% (floor ${MIN_LINE_COVERAGE}%)"
          cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

          # Integer comparison, because the shell has no floats and a fractional point either
          # side of the floor is not a signal worth failing a build over.
          if [ "${line%%.*}" -lt "$MIN_LINE_COVERAGE" ]; then
            echo "::error::Line coverage is ${line}%, below the ${MIN_LINE_COVERAGE}% floor. Either the change needs tests, or the floor needs a deliberate, argued change - not a quiet one."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 7

  seed-is-deterministic:
    name: Seed generator is deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # The seed AND the snapshot are both committed, and both are generated by this one
      # command. The snapshot is the file the storefront actually browses from, so a
      # generator that drifts would give a shop that disagrees with its own catalog.
      #
      # BOTH PATHS ARE PASSED EXPLICITLY, AND THAT IS THE WHOLE FIX. SeedGen takes
      # [seed-path] [snapshot-path] and defaults EITHER of them to its committed location
      # when the argument is absent. This step used to pass one argument, so every CI run
      # regenerated the snapshot straight over the committed file in the workspace and then
      # compared only the seed - the gate was green because it was diffing a file against
      # a copy of itself, while the file it was supposed to be protecting was never
      # compared at all. The README table that cites this job as proof the snapshot is
      # byte-identical between runs was, until this commit, describing a check that did not
      # happen.
      - name: Regenerate the catalog and compare
        run: |
          dotnet run --project tools/VelaCommerce.SeedGen -- \
            /tmp/regenerated.seed.json \
            /tmp/regenerated.snapshot.json

          failed=0

          if ! diff -q seed/catalog.seed.json /tmp/regenerated.seed.json >/dev/null; then
            echo "::error::The seed generator is no longer deterministic, or seed/catalog.seed.json is stale."
            diff <(head -40 seed/catalog.seed.json) <(head -40 /tmp/regenerated.seed.json) || true
            failed=1
          fi

          snapshot=src/VelaCommerce.Storefront/wwwroot/catalog.snapshot.json
          if ! diff -q "$snapshot" /tmp/regenerated.snapshot.json >/dev/null; then
            echo "::error::$snapshot is stale, or the snapshot builder is no longer deterministic."
            echo "::error::This is the file the storefront browses from - a fresh page load reads it and nothing else."
            diff <(head -c 2000 "$snapshot") <(head -c 2000 /tmp/regenerated.snapshot.json) || true
            failed=1
          fi

          # The backstop for the bug above: if a future edit drops an argument again, the
          # generator writes into the working tree instead of /tmp, and this notices even
          # though both diffs above would then trivially pass.
          if ! git diff --quiet; then
            echo "::error::Regenerating the catalog modified tracked files. SeedGen was given too few arguments and"
            echo "::error::wrote into the working tree, which makes the comparisons above meaningless."
            git --no-pager diff --stat
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          echo "Seed and snapshot both regenerated byte-identical."

  openapi-is-current:
    name: OpenAPI document is current
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Generation runs the API's entry point, so it obeys ASPNETCORE_ENVIRONMENT. Pinning it
    # to Production keeps Program.cs out of its Development branch, which migrates and seeds
    # and would drag a live PostgreSQL into a job that only wants to describe the API. It
    # also fixes the document's shape: the same API emits its paths in a different order
    # under Development, which would fail this check for no real reason.
    env:
      ASPNETCORE_ENVIRONMENT: Production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # src/VelaCommerce.Api/openapi.json is a build output that happens to be committed, so
      # the docs site and the Bruno collection can be diffed against the API instead of
      # trusting that someone remembered to update them. Move it aside, rebuild, and fail if
      # what comes back is not byte-identical. Moving it aside rather than diffing in place
      # also catches a build that silently stopped emitting the document at all.
      #
      # The .cache file has to go too. The generator's MSBuild target declares that cache as
      # its only output and the compiled assembly as its only input, so with both still
      # present the target is skipped as up to date and the document is never rewritten:
      # the check would then compare the committed file against itself and always pass.
      - name: Regenerate the OpenAPI document and compare
        run: |
          cp src/VelaCommerce.Api/openapi.json /tmp/committed-openapi.json
          rm src/VelaCommerce.Api/openapi.json
          rm -f src/VelaCommerce.Api/obj/VelaCommerce.Api.OpenApiFiles.cache
          dotnet build src/VelaCommerce.Api/VelaCommerce.Api.csproj --configuration Release -warnaserror
          if [ ! -f src/VelaCommerce.Api/openapi.json ]; then
            echo "::error::The build no longer emits src/VelaCommerce.Api/openapi.json. Check the Microsoft.Extensions.ApiDescription.Server package reference and the OpenApi* properties in VelaCommerce.Api.csproj."
            exit 1
          fi
          if ! diff -q /tmp/committed-openapi.json src/VelaCommerce.Api/openapi.json >/dev/null; then
            echo "::error::src/VelaCommerce.Api/openapi.json is stale. The API surface changed without the committed document being updated. Run 'dotnet build src/VelaCommerce.Api' and commit the regenerated src/VelaCommerce.Api/openapi.json."
            diff /tmp/committed-openapi.json src/VelaCommerce.Api/openapi.json | head -60 || true
            exit 1
          fi
          echo "OpenAPI document regenerated byte-identical."

  model-matches-migrations:
    name: EF model matches its migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # The manifest is at the repository root rather than .config/dotnet-tools.json, so the
      # path has to be given: `dotnet tool restore` with no argument looks only in .config
      # and would report "no manifest" as a success.
      - name: Restore the local tools
        run: dotnet tool restore --tool-manifest dotnet-tools.json

      # `dotnet tool restore` restores the TOOLS. It does not restore the PROJECT, and this job
      # used to go straight from there to dotnet-ef, on a runner whose checkout has no obj/ at
      # all. dotnet-ef tried to build, hit
      #
      #   error NETSDK1004: Assets file '.../obj/project.assets.json' not found.
      #   Unable to retrieve project metadata. Ensure it's an SDK-style project.
      #
      # and exited non-zero - which the `if !` below then reported as "the EF model has changed
      # with no migration to match". The gate was red on every run since it was added, always
      # naming a cause that was never true, and it had therefore never once checked the model it
      # exists to check. A gate that cannot tell "I could not run" from "I found a problem" is
      # worse than no gate: it trains you to ignore it.
      #
      # Building here rather than letting dotnet-ef do it is what separates the two. A broken
      # build now fails THIS step, with the compiler's own message; the check that follows runs
      # --no-build, so the only thing left that can fail it is genuine drift.
      - name: Build the model's project
        run: |
          dotnet restore src/VelaCommerce.Infrastructure
          dotnet build --no-restore --configuration Release src/VelaCommerce.Infrastructure

      # A model edited without a migration is invisible until deployment, where it becomes a
      # revision meeting a schema it cannot read. The command exits non-zero when the model
      # has drifted, which is exactly the gate wanted here.
      #
      # Infrastructure is BOTH project and startup project on purpose: it holds
      # DesignTimeDbContextFactory, and the API host does not reference
      # Microsoft.EntityFrameworkCore.Design, so pointing the tool at the API fails with
      # "your startup project doesn't reference..." rather than with a real answer.
      - name: Check for a model without a migration
        run: |
          if ! dotnet tool run dotnet-ef migrations has-pending-model-changes \
                 --no-build --configuration Release \
                 --project src/VelaCommerce.Infrastructure \
                 --startup-project src/VelaCommerce.Infrastructure; then
            echo "::error::The EF model has changed with no migration to match. Run:"
            echo "::error::  dotnet tool run dotnet-ef migrations add <Name> --project src/VelaCommerce.Infrastructure --startup-project src/VelaCommerce.Infrastructure --output-dir Persistence/Migrations"
            exit 1
          fi

  api-collection:
    name: Bruno API collection
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A service container rather than Testcontainers, and the two are not interchangeable
    # here. Testcontainers is a test-host library: it starts a container from inside a
    # running .NET test, which is exactly right for the Integration.Tests job above. This
    # job has no .NET test host at all - it starts the real API as a process and points a
    # Node CLI at it - so using Testcontainers would mean writing a launcher program whose
    # only job is to own a container's lifecycle for the benefit of a sibling process.
    # A service container is one block of YAML, is up before the first step runs, and
    # GitHub health-checks it for us.
    services:
      postgres:
        # Pinned to the same major the Integration tests use, so CI cannot pass here and
        # fail there on a behaviour difference between server versions.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vela
          POSTGRES_PASSWORD: vela
          POSTGRES_DB: vela_ci
        ports:
          - 5432:5432
        # Without a health check the API would start against a database still initialising
        # and fail its first migration.
        options: >-
          --health-cmd "pg_isready --username vela --dbname vela_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      VELA_DB_CONNECTION: Host=localhost;Port=5432;Database=vela_ci;Username=vela;Password=vela
      # Development is required twice over, and neither is cosmetic. Only this branch of
      # Program.cs migrates and seeds, so it is what puts a catalog behind the requests;
      # and only in Development is the demo-session cookie issued without Secure, so it
      # survives plain http. Under Production the browser-equivalent would drop the cookie
      # and every cart request would arrive as a different visitor - the cart assertions
      # would fail with an empty cart and look like a cart bug rather than a config one.
      ASPNETCORE_ENVIRONMENT: Development
      # Must match baseUrl in api-tests/environments/local.bru.
      ASPNETCORE_URLS: http://localhost:5008

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # No actions/setup-node step: ubuntu-latest ships Node and npm, and this job needs
      # neither a particular version nor a lockfile - only a CLI to invoke. The Bruno
      # version is pinned instead, because that is the thing whose behaviour the assertions
      # depend on.
      - name: Install the Bruno CLI
        run: npm install --global @usebruno/cli@4.1.0

      - name: Build the API
        run: dotnet build src/VelaCommerce.Api/VelaCommerce.Api.csproj --configuration Release -warnaserror

      # Run the built assembly rather than `dotnet run`, so the thing in the background is
      # the API itself and not a wrapper holding a child process.
      #
      # --contentroot is absolute on purpose, and this was measured rather than assumed: a
      # relative content root resolves against the assembly's own directory, not the working
      # directory, so `--contentroot src/VelaCommerce.Api` sends the host looking inside
      # bin/Release/net10.0 and it dies on a DirectoryNotFoundException before it listens.
      # The content root has to be right because the seeder reads ../../seed/catalog.seed.json
      # relative to it - get it wrong and the API starts fine against an empty catalog, and
      # every assertion fails for reasons that have nothing to do with the API.
      - name: Start the API
        run: |
          nohup dotnet src/VelaCommerce.Api/bin/Release/net10.0/VelaCommerce.Api.dll \
            --contentroot "$GITHUB_WORKSPACE/src/VelaCommerce.Api" > api.log 2>&1 &
          echo $! > api.pid

          # Poll readiness, not liveness: /alive answers before the database is reachable
          # and before migrations and the 288-product seed have finished, so waiting on it
          # would hand the collection an empty catalog.
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:5008/health > /dev/null 2>&1; then
              echo "API ready after ${attempt}s."
              exit 0
            fi
            if ! kill -0 "$(cat api.pid)" 2>/dev/null; then
              echo "::error::The API exited during startup."
              cat api.log
              exit 1
            fi
            sleep 1
          done
          echo "::error::The API never became ready within 60s."
          cat api.log
          exit 1

      # No --bail: a failure in the cart lifecycle cascades into the requests after it, and
      # the whole cascade is more diagnostic than its first frame.
      - name: Run the collection
        working-directory: api-tests
        run: |
          # bru does not create the reporter's output directory, and does not fail when it
          # is missing: it prints one line and exits 0 with no report written. Measured, and
          # the reason this mkdir is not decoration - without it the upload step below would
          # quietly publish an empty artifact on every run.
          mkdir -p ../artifacts/api-tests
          bru run -r \
            --env local \
            --reporter-html ../artifacts/api-tests/report.html \
            --reporter-junit ../artifacts/api-tests/report.xml

      # The API's own log is attached whatever happens: a failed assertion usually names the
      # response, and the reason for that response is in here.
      - name: API log
        if: always()
        run: cat api.log || true

      - name: Upload collection results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-test-results
          path: artifacts/api-tests
          retention-days: 7

      - name: Stop the API
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true

  # =======================================================================================
  # The container image. Builds on every PR, publishes only from main.
  #
  # This job used to live in deploy.yml, where it was `needs: preflight` - and preflight
  # hard-fails on three Azure repository variables that the image build never uses. So a
  # build that touches no cloud account at all was gated behind a cloud account, on a
  # workflow whose only trigger is workflow_dispatch. Nothing has ever built it.
  #
  # It belongs here. Building the image proves things the test suite cannot: that the
  # storefront actually lands in the API's wwwroot, that the seed is actually published, and
  # that the whole thing starts. Publishing it is what makes `docker compose up` in the
  # README something a stranger can run.
  # =======================================================================================
  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Widened from the workflow default of contents: read, and only here. No id-token:
    # write anywhere in this file - a job that cannot mint an OIDC token cannot
    # accidentally authenticate to a cloud.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # The API project does not reference the storefront - that absence is the architecture
      # and an architecture test enforces it - so the shop's files are copied in here rather
      # than arriving through a project reference.
      - name: Publish the storefront
        run: >-
          dotnet publish src/VelaCommerce.Storefront/VelaCommerce.Storefront.csproj
          --configuration Release
          --output artifacts/storefront

      - name: Stage the storefront as the API's wwwroot
        run: |
          rm -rf src/VelaCommerce.Api/wwwroot
          cp -R artifacts/storefront/wwwroot src/VelaCommerce.Api/wwwroot
          echo "Staged $(find src/VelaCommerce.Api/wwwroot -type f | wc -l) storefront files."
          # index.html is what StorefrontAssets treats as proof that a directory really is a
          # storefront. Absent, the API boots and serves itself with no shop attached, which
          # is a correct behaviour there and a silently broken image here.
          test -f src/VelaCommerce.Api/wwwroot/index.html \
            || { echo "::error::The staged storefront has no index.html; the API would boot without a shop."; exit 1; }

      # -p:OpenApiGenerateDocumentsOnBuild=false IS REQUIRED and is not a matter of taste:
      # the generator runs the built assembly to describe the API, and under --os linux
      # --arch x64 on a non-x64 host that assembly cannot be loaded. openapi-is-current
      # already proves the committed document matches on every push.
      #
      # ContainerFamily=noble-chiseled-extra: chiseled Ubuntu, the -extra variant. Plain
      # chiseled, alpine and distroless all require InvariantGlobalization=true, which
      # silently breaks currency formatting in a shop. -extra keeps ICU and tzdata.
      # ContainerArchiveOutputPath is resolved relative to the PROJECT directory, not the
      # working directory, so a relative path here writes to
      # src/VelaCommerce.Api/artifacts/image/ and the load step below looks in
      # ./artifacts/image/ and finds nothing. That is what the first run of this job did: it
      # died on `docker load` under `set -e`, before any ::error:: could print, and reported
      # "Process completed with exit code 1" and not one word more. github.workspace makes it
      # absolute and the question does not arise.
      - name: Build the container image
        run: >-
          dotnet publish src/VelaCommerce.Api/VelaCommerce.Api.csproj
          --configuration Release
          --os linux --arch x64
          -p:OpenApiGenerateDocumentsOnBuild=false
          -p:ContainerFamily=noble-chiseled-extra
          -p:PublishReadyToRun=true
          -p:PublishRepositoryUrl=true
          -p:ContainerRepository=vela-commerce
          -p:ContainerImageTag=build
          /t:PublishContainer
          -p:ContainerArchiveOutputPath=${{ github.workspace }}/artifacts/image/vela-commerce.tar.gz

      # -----------------------------------------------------------------------------------
      # Load it, check what it actually weighs, and check it actually contains a shop.
      #
      # THE SIZE IS READ FROM THE LOADED IMAGE, never from the archive on disk. The archive
      # is gzipped and lands around a third of the image, so a budget applied to `stat` on
      # the tarball stays comfortably green while the image itself doubles. That is a gate
      # that reports success for the wrong measurement, which is worse than none.
      #
      # 240 MB, and the number is measured rather than chosen. The first version of this gate
      # used the ~140 MB in docs/PLAN.md and failed at 206 MB - correctly. That budget had
      # been written for an API-only image, and this one also carries the entire Blazor shop.
      # Extracting the filesystem and counting bytes:
      #
      #   /usr   157 MB   the .NET runtime and ICU. noble-chiseled-extra keeps ICU on
      #                   purpose: every smaller base (plain chiseled, alpine, distroless)
      #                   requires InvariantGlobalization=true, which silently breaks
      #                   currency formatting in a shop.
      #   /app    56 MB   of which 22 MB is the storefront's wwwroot and 0.4 MB the catalog
      #                   seed; the rest is the app and its dependencies.
      #
      # So 157 MB is the floor before a single line of this project's code is added, and the
      # old budget was never reachable. 240 MB leaves room to grow and still catches the
      # thing worth catching: a dependency or an asset arriving by accident.
      # -----------------------------------------------------------------------------------
      - name: Load, measure and inspect
        id: load
        env:
          MAX_IMAGE_MB: "240"
        run: |
          set -euo pipefail

          # Every stage echoes what it is about to do. The first version of this step failed
          # with a bare "Process completed with exit code 1" and no annotation, which is the
          # least useful thing a gate can say, and it said it because the failure was a
          # command dying under `set -e` rather than one of the explicit ::error:: exits.
          echo "::group::Loading the archive"
          load_output="$(docker load --input artifacts/image/vela-commerce.tar.gz)"
          echo "$load_output"
          echo "::endgroup::"

          # tail, not head. `head -n1` closes the pipe on the first match, which sends SIGPIPE
          # to sed, which pipefail then turns into a failed pipeline - invisibly, and only
          # when the producer is still writing.
          loaded="$(printf '%s\n' "$load_output" | sed -n 's/^Loaded image: //p' | tail -n1)"
          if [ -z "$loaded" ]; then
            echo "::error::docker load did not report an image name. The archive is missing or malformed."
            exit 1
          fi
          echo "loaded=${loaded}" >> "$GITHUB_OUTPUT"

          bytes="$(docker image inspect --format '{{.Size}}' "$loaded")"
          mb=$(( bytes / 1024 / 1024 ))
          echo "Image ${loaded} is ${mb} MB."

          if [ "$mb" -gt "$MAX_IMAGE_MB" ]; then
            echo "::error::The image is ${mb} MB, over the ${MAX_IMAGE_MB} MB budget in docs/PLAN.md."
            exit 1
          fi

          # ---------------------------------------------------------------------------------
          # The two assets that arrive by COPY rather than by project reference, and so are
          # the two that can silently go missing. Checked inside the image, because checking
          # the publish directory checks the wrong filesystem.
          #
          # `docker cp` on the exact paths, not `docker export | tar -tf -`. The export streams
          # the entire filesystem - hundreds of megabytes - and tar stops reading at the
          # end-of-archive marker while docker is still writing, so docker takes SIGPIPE and
          # `set -o pipefail` turns a successful listing into a failed step. `docker cp`
          # already exits non-zero when the path is absent, which is the whole question, and
          # it copies two files instead of streaming the world to answer it.
          # ---------------------------------------------------------------------------------
          echo "::group::Checking the image contains a shop and a catalog"
          docker create --name image-contents "$loaded" > /dev/null
          trap 'docker rm -f image-contents > /dev/null 2>&1 || true' EXIT

          for required in /app/wwwroot/index.html /app/seed/catalog.seed.json; do
            if docker cp "image-contents:${required}" /tmp/check-asset > /dev/null 2>&1; then
              echo "Found ${required} ($(wc -c < /tmp/check-asset) bytes)."
              rm -f /tmp/check-asset
            else
              echo "::error::${required} is not in the image. It would boot without one, and say nothing."
              exit 1
            fi
          done
          echo "::endgroup::"

          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image size | ${mb} MB (budget ${MAX_IMAGE_MB} MB) |" >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------------------
      # Everything above runs on a pull request too, so a change that breaks the image fails
      # the PR that made it. Only main publishes: a fork PR gets a read-only GITHUB_TOKEN
      # and could not push anyway, and a PR that could publish under this repository's name
      # would be a supply-chain hole rather than a convenience.
      # -----------------------------------------------------------------------------------
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------------------
      # TWO TAGS, and the difference between them is the whole point.
      #
      #   sha-<commit>  immutable by construction: one commit, one tag, never moved. This is
      #                 what a deploy references, and deploy.yml resolves it to a digest
      #                 before it deploys anything.
      #   main          mutable, and it exists for exactly one reader: a person running
      #                 `docker compose up` from the README, who wants the current shop and
      #                 has no interest in commit hashes.
      #
      # deploy.yml used to say latest and main are "deliberately NOT pushed" because a
      # mutable tag is what a digest deploy exists to avoid. That reasoning is still right
      # and the rule it produced was too broad: the thing to forbid is a mutable tag
      # REACHING A DEPLOY, not a mutable tag existing. deploy.yml's comment now says that.
      #
      # The registry path is lowercased because OCI repository names must be lowercase while
      # github.repository preserves the owner's registered capitalisation - fine here, a
      # confusing 400 for a fork under a mixed-case account.
      # -----------------------------------------------------------------------------------
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LOADED: ${{ steps.load.outputs.loaded }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          repository="ghcr.io/$(echo "$GITHUB_REPOSITORY_NAME" | tr '[:upper:]' '[:lower:]')"

          docker tag "$LOADED" "${repository}:sha-${COMMIT_SHA}"
          docker tag "$LOADED" "${repository}:main"
          docker push "${repository}:sha-${COMMIT_SHA}"
          docker push "${repository}:main"

          echo "| Published | \`${repository}:main\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Immutable tag | \`${repository}:sha-${COMMIT_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------------------
      # THE CHECK THAT CATCHES THE TRAP EVERY OTHER GATE IS GREEN THROUGH.
      #
      # A package published to GHCR by GITHUB_TOKEN is created PRIVATE, even from a public
      # repository. Every step above succeeds, the README says `docker compose up`, and a
      # stranger gets "denied" from a registry they have no account on. Nothing in the build
      # can notice, because the build is authenticated.
      #
      # So log out and pull as a stranger would. A failure here is not fatal to the run -
      # the image is fine and the fix is one click in the package settings - but it must be
      # loud, and it must say what to click.
      # -----------------------------------------------------------------------------------
      - name: Can a stranger pull it?
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          repository="ghcr.io/$(echo "$GITHUB_REPOSITORY_NAME" | tr '[:upper:]' '[:lower:]')"

          docker logout ghcr.io
          docker image rm "${repository}:main" > /dev/null 2>&1 || true

          if docker pull "${repository}:main"; then
            echo "Anonymous pull works: docker compose up will work for anyone."
          else
            echo "::error::The package is PRIVATE, so 'docker compose up' fails for everyone but you. Fix: GitHub -> Packages -> vela-commerce -> Package settings -> Change visibility -> Public. This is the default for a GITHUB_TOKEN-published package and is not visible from any other check."
          fi

  terraform:
    name: Terraform is formatted and valid
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # This job proves the infrastructure code compiles. It holds no credentials, names no
    # subscription, and makes no cloud call - which is the only reason it can run on every
    # pull request, including one from a fork.
    #
    # WHAT IS DELIBERATELY ABSENT: `terraform plan`. A plan CONFIGURES the azurerm provider,
    # and configuring it performs resource-provider registration - a subscription-level
    # WRITE - before it has read a single resource. So a plan is not a read-only preview
    # here, and this repository's Azure subscription is deliberately untouched until the one
    # planned deploy. `validate` is the strongest check available without paying that price:
    # it type-checks every expression, every variable and every provider schema reference
    # offline, once the provider is installed. See infra/README.md.
    #
    # No tflint step: tflint is not installed anywhere in this project, and a linter added to
    # CI that nobody can run locally produces failures nobody can reproduce.

    defaults:
      run:
        working-directory: infra

    env:
      # Drops the "Terraform has been successfully initialized" banner art and the
      # interactive suggestions, which are noise in a log nobody is sitting in front of.
      TF_IN_AUTOMATION: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No setup-dotnet here: nothing in infra/ is .NET. The other jobs pin the SDK through
      # global.json; this one pins the only tool it uses.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          # Pinned, not `latest`. infra/versions.tf declares `required_version = "~> 1.16"`,
          # and 1.16.0 is the version the configuration was actually validated against. With
          # `latest` this job would silently move to whatever HashiCorp shipped this morning,
          # and the first time a new minor tightened a validation rule the failure would look
          # like it came from the commit that happened to be pushed.
          terraform_version: 1.16.0
          # The wrapper re-exposes stdout, stderr and the exit code as step outputs. Nothing
          # here reads those outputs, and the wrapper's own exit handling is one more layer
          # between a real `terraform validate` failure and a red build. Turn it off and let
          # the process exit code be the truth.
          terraform_wrapper: false

      # fmt needs no init - it is a parser and a printer. Running it first means a formatting
      # slip fails in ten seconds instead of after a provider download.
      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # -backend=false is what makes this credential-free: it skips backend initialisation
      # entirely, so Terraform never looks for the azurerm state storage account and never
      # needs `az login`. Providers still come from registry.terraform.io, which is a public,
      # anonymous read.
      #
      # -input=false so a prompt can never hang the runner for six hours waiting on a stdin
      # that will not arrive.
      #
      # NOT `-lockfile=readonly`, and this is measured rather than defensive: the committed
      # infra/.terraform.lock.hcl was generated on darwin_arm64, so it carries one `h1:` hash
      # for that platform plus the registry's `zh:` hashes, which cover every platform. Init
      # on linux_amd64 verifies against the `zh:` set, succeeds, and then RECORDS the
      # linux_amd64 `h1:` into the workspace copy of the lock file. `-lockfile=readonly`
      # turns that ordinary bookkeeping into a hard failure. The durable fix is to pre-record
      # both platforms locally and commit the result:
      #
      #     cd infra && terraform providers lock -platform=linux_amd64 -platform=darwin_arm64
      #
      # Until someone runs that, the step below reports the drift as a notice rather than
      # failing a build over a hash that Terraform was always going to add.
      - name: Initialize without a backend
        run: terraform init -backend=false -input=false

      - name: Note whether the lock file gained a platform
        if: always()
        run: |
          if ! git diff --quiet -- .terraform.lock.hcl; then
            echo "::notice::terraform init added a platform hash to infra/.terraform.lock.hcl. Not a failure. Run 'terraform providers lock -platform=linux_amd64 -platform=darwin_arm64' in infra/ and commit the result to make this stop."
          fi

      - name: Validate
        run: terraform validate -no-color
