name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. The deploy workflow adds id-token: write for OIDC;
# this one only ever reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          # No version here on purpose: global.json pins the SDK, so CI and the
          # developer machine cannot drift apart silently.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Domain tests
        run: >-
          dotnet test tests/VelaCommerce.Domain.Tests
          --no-build --configuration Release
          --logger "trx;LogFileName=domain.trx"
          --results-directory artifacts/test-results

      # Testcontainers starts a real PostgreSQL 18. The ubuntu-latest runner ships
      # a working Docker daemon, so no service container is declared here; letting
      # Testcontainers own the lifecycle keeps this identical to a local run.
      - name: Integration tests
        run: >-
          dotnet test tests/VelaCommerce.Integration.Tests
          --no-build --configuration Release
          --logger "trx;LogFileName=integration.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 7

  seed-is-deterministic:
    name: Seed generator is deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The catalog snapshot is committed and served from a CDN, so a generator that
      # drifts between runs would produce noisy diffs and a storefront that disagrees
      # with itself. Regenerate and fail if the committed file is not byte-identical.
      - name: Regenerate the catalog and compare
        run: |
          dotnet run --project tools/VelaCommerce.SeedGen -- /tmp/regenerated.seed.json
          if ! diff -q seed/catalog.seed.json /tmp/regenerated.seed.json >/dev/null; then
            echo "::error::The seed generator is no longer deterministic, or seed/catalog.seed.json is stale."
            diff <(head -40 seed/catalog.seed.json) <(head -40 /tmp/regenerated.seed.json) || true
            exit 1
          fi
          echo "Catalog regenerated byte-identical."
